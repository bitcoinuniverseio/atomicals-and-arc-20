name: Documentation defect
description: A typo, a broken link, a confusing passage, or a formatting problem.
labels: [documentation-defect]
body:
  - type: input
    id: page-id
    attributes:
      label: Page ID
      description: The page ID from the source panel at the top of the page. It is stable across locales and versions.
      placeholder: protocol/arc20/allocation
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Locale
      placeholder: en
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the passage if you can.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What it should say
    validations:
      required: false

